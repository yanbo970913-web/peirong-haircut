<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理員後台 — 沛蓉百元剪髮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c8a96e; --gold-light: #e2c99a; --gold-dark: #9a7640;
      --cream: #f5efe3; --warm-white: #fdf8f0;
      --wood: #2a1f0e; --wood-mid: #3d2c13; --wood-light: #5a3e1b;
      --muted: #8a7560; --red: #c0392b; --green: #27ae60;
      --font-serif: 'Noto Serif TC', serif;
      --font-body: 'Noto Sans TC', sans-serif;
      --radius: 8px; --transition: .3s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--wood); font-family: var(--font-body); min-height: 100vh; }
    a { color: inherit; text-decoration: none; }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      position: fixed; inset: 0; z-index: 9000;
      background: var(--wood);
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: var(--wood-mid);
      border: 1px solid var(--gold-dark);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 360px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .login-icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .login-title {
      font-family: var(--font-serif);
      font-size: 1.3rem; font-weight: 900;
      color: var(--gold-light);
      margin-bottom: .4rem; letter-spacing: .06em;
    }
    .login-sub { font-size: .8rem; color: var(--muted); margin-bottom: 2rem; letter-spacing: .08em; }
    .login-box input {
      width: 100%;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--gold-dark);
      border-radius: var(--radius);
      padding: .85rem 1rem;
      color: var(--cream);
      font-family: var(--font-body); font-size: .95rem;
      outline: none;
      transition: border-color var(--transition);
      text-align: center; letter-spacing: .2em;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box input::placeholder { color: var(--muted); letter-spacing: .08em; }
    .login-btn {
      margin-top: 1rem;
      width: 100%;
      padding: .9rem;
      background: var(--gold);
      border: none; border-radius: var(--radius);
      color: var(--wood);
      font-size: .9rem; font-weight: 700;
      letter-spacing: .1em;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
    }
    .login-btn:hover { background: var(--gold-light); transform: translateY(-2px); }
    .login-error {
      margin-top: .8rem;
      font-size: .8rem; color: var(--red);
      display: none;
    }

    /* ── ADMIN LAYOUT ── */
    #admin-app { display: none; }
    .admin-header {
      background: var(--wood);
      border-bottom: 2px solid var(--gold-dark);
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
      position: sticky; top: 0; z-index: 100;
    }
    .admin-header-title {
      font-family: var(--font-serif);
      color: var(--gold-light);
      font-size: 1rem; font-weight: 700;
      letter-spacing: .08em;
    }
    .admin-header-right { display: flex; align-items: center; gap: 1rem; }
    .back-link {
      font-size: .8rem; color: var(--muted);
      letter-spacing: .06em;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--gold); }
    .logout-btn {
      background: transparent; border: 1px solid rgba(200,169,110,.3);
      border-radius: var(--radius); padding: .4rem .9rem;
      color: var(--muted); font-size: .78rem; letter-spacing: .08em;
      cursor: pointer; transition: all var(--transition);
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    .admin-main {
      max-width: 820px; margin: 0 auto;
      padding: 3rem 1.5rem 6rem;
    }
    .admin-section {
      background: white;
      border: 1px solid rgba(200,169,110,.2);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 12px rgba(42,31,14,.08);
    }
    .admin-section-title {
      font-family: var(--font-serif);
      font-size: .82rem; font-weight: 700;
      letter-spacing: .2em;
      color: var(--gold-dark);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      padding-bottom: .7rem;
      border-bottom: 1px solid rgba(200,169,110,.2);
    }
    .field-group {
      display: flex; flex-direction: column; gap: 1.1rem;
    }
    .field {
      display: flex; flex-direction: column; gap: .4rem;
    }
    .field label {
      font-size: .78rem; font-weight: 600;
      color: var(--muted); letter-spacing: .08em;
      text-transform: uppercase;
    }
    .field input,
    .field textarea {
      border: 1.5px solid rgba(200,169,110,.3);
      border-radius: var(--radius);
      padding: .7rem .9rem;
      font-family: var(--font-body); font-size: .9rem;
      color: var(--wood);
      background: var(--warm-white);
      outline: none;
      resize: vertical;
      transition: border-color var(--transition);
    }
    .field input:focus,
    .field textarea:focus { border-color: var(--gold); }
    .field .hint {
      font-size: .7rem; color: var(--muted);
      letter-spacing: .04em;
    }
    .field .hint code {
      background: rgba(200,169,110,.12);
      padding: .1rem .3rem; border-radius: 3px;
      font-size: .68rem; color: var(--gold-dark);
    }

    /* ── SAVE BAR ── */
    .save-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: var(--wood);
      border-top: 2px solid var(--gold-dark);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .save-bar-info {
      font-size: .82rem; color: var(--muted); letter-spacing: .04em;
    }
    .save-btn {
      background: var(--gold); border: none;
      border-radius: var(--radius);
      padding: .8rem 2.2rem;
      color: var(--wood); font-size: .88rem; font-weight: 700;
      letter-spacing: .1em;
      cursor: pointer; transition: all var(--transition);
    }
    .save-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
    .save-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── TOAST ── */
    .toast {
      position: fixed; top: 80px; right: 2rem; z-index: 9999;
      background: var(--wood);
      color: var(--cream);
      border: 1px solid var(--gold-dark);
      border-radius: var(--radius);
      padding: .9rem 1.5rem;
      font-size: .85rem; letter-spacing: .04em;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
      transform: translateX(120%);
      transition: transform .35s cubic-bezier(.25,.46,.45,.94);
      pointer-events: none;
    }
    .toast.show { transform: translateX(0); }
    .toast.success { border-color: var(--green); }
    .toast.error   { border-color: var(--red); }

    /* ── PREVIEW LINK ── */
    .preview-row {
      display: flex; justify-content: center; margin-bottom: 2rem;
    }
    .preview-link {
      display: inline-flex; align-items: center; gap: .5rem;
      border: 1px dashed var(--gold-dark);
      border-radius: var(--radius);
      padding: .6rem 1.4rem;
      font-size: .82rem; color: var(--gold-dark); letter-spacing: .08em;
      transition: all var(--transition);
    }
    .preview-link:hover {
      background: var(--gold-dark); color: var(--cream);
    }

    /* ── PASSWORD CHANGE SECTION ── */
    .pwd-group { display: flex; gap: .8rem; }
    .pwd-group input { flex: 1; }
    .pwd-btn {
      background: var(--wood-mid); border: 1px solid var(--gold-dark);
      border-radius: var(--radius);
      padding: .7rem 1.2rem;
      color: var(--gold); font-size: .82rem; font-weight: 600;
      letter-spacing: .08em;
      cursor: pointer; white-space: nowrap;
      transition: all var(--transition);
    }
    .pwd-btn:hover { background: var(--wood); border-color: var(--gold); }
  </style>
</head>
<body>

  <!-- ░░ LOGIN ░░ -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-icon">✂</div>
      <h1 class="login-title">管理員後台</h1>
      <p class="login-sub">沛蓉百元剪髮 · 僅限管理員存取</p>
      <input type="password" id="pwd-input" placeholder="輸入管理員密碼" autocomplete="current-password" />
      <button class="login-btn" onclick="doLogin()">登入</button>
      <p class="login-error" id="login-err">密碼錯誤，請再試一次</p>
    </div>
  </div>

  <!-- ░░ ADMIN APP ░░ -->
  <div id="admin-app">

    <header class="admin-header">
      <div class="admin-header-title">✂ 後台管理</div>
      <div class="admin-header-right">
        <a href="index.html" class="back-link">← 回到網站</a>
        <button class="logout-btn" onclick="doLogout()">登出</button>
      </div>
    </header>

    <main class="admin-main">

      <div class="preview-row">
        <a href="index.html" target="_blank" class="preview-link">
          👁 預覽網站
        </a>
      </div>

      <!-- 基本資訊 -->
      <div class="admin-section">
        <div class="admin-section-title">🏪 基本資訊</div>
        <div class="field-group">
          <div class="field">
            <label>店名</label>
            <input type="text" id="f-site_name" />
          </div>
          <div class="field">
            <label>副標題</label>
            <input type="text" id="f-site_tagline" />
          </div>
        </div>
      </div>

      <!-- Hero 區塊 -->
      <div class="admin-section">
        <div class="admin-section-title">🦸 主視覺區塊</div>
        <div class="field-group">
          <div class="field">
            <label>主打價格</label>
            <input type="text" id="f-hero_price" />
          </div>
          <div class="field">
            <label>描述文字</label>
            <textarea id="f-hero_desc" rows="3"></textarea>
            <p class="hint">換行請按 Enter 即可</p>
          </div>
        </div>
      </div>

      <!-- 資訊卡 -->
      <div class="admin-section">
        <div class="admin-section-title">🕐 服務資訊</div>
        <div class="field-group">
          <div class="field">
            <label>營業時間（支援 HTML）</label>
            <textarea id="f-hours" rows="2"></textarea>
            <p class="hint">可使用 <code>&lt;strong&gt;</code> 加粗、<code>&lt;br/&gt;</code> 換行</p>
          </div>
          <div class="field">
            <label>營業時間備註</label>
            <input type="text" id="f-hours_note" />
          </div>
          <div class="field">
            <label>收費方式（支援 HTML）</label>
            <textarea id="f-pricing" rows="2"></textarea>
          </div>
          <div class="field">
            <label>收費備註</label>
            <input type="text" id="f-pricing_note" />
          </div>
          <div class="field">
            <label>預約方式（支援 HTML）</label>
            <textarea id="f-booking" rows="2"></textarea>
          </div>
          <div class="field">
            <label>預約備註</label>
            <input type="text" id="f-booking_note" />
          </div>
        </div>
      </div>

      <!-- 聯絡資訊 -->
      <div class="admin-section">
        <div class="admin-section-title">📞 聯絡資訊</div>
        <div class="field-group">
          <div class="field">
            <label>電話號碼</label>
            <input type="tel" id="f-phone" />
          </div>
          <div class="field">
            <label>LINE ID</label>
            <input type="text" id="f-line_id" />
          </div>
          <div class="field">
            <label>聯絡區塊標題</label>
            <input type="text" id="f-contact_title" />
          </div>
          <div class="field">
            <label>聯絡區塊說明</label>
            <input type="text" id="f-contact_sub" />
          </div>
        </div>
      </div>

      <!-- 位置 -->
      <div class="admin-section">
        <div class="admin-section-title">📍 位置資訊</div>
        <div class="field-group">
          <div class="field">
            <label>地址（支援 HTML）</label>
            <textarea id="f-address" rows="2"></textarea>
          </div>
          <div class="field">
            <label>捷運說明</label>
            <input type="text" id="f-mrt" />
          </div>
          <div class="field">
            <label>公車說明</label>
            <input type="text" id="f-bus" />
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="admin-section">
        <div class="admin-section-title">📋 頁尾資訊</div>
        <div class="field-group">
          <div class="field">
            <label>版權文字</label>
            <input type="text" id="f-footer_copy" />
          </div>
        </div>
      </div>

      <!-- 密碼變更 -->
      <div class="admin-section">
        <div class="admin-section-title">🔐 變更管理員密碼</div>
        <div class="field-group">
          <div class="field">
            <label>新密碼</label>
            <div class="pwd-group">
              <input type="password" id="new-pwd" placeholder="輸入新密碼" />
              <button class="pwd-btn" onclick="changePwd()">確認變更</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 匯出說明 -->
      <div class="admin-section">
        <div class="admin-section-title">📦 部署說明</div>
        <div class="field-group">
          <div class="field">
            <p style="font-size:.85rem;color:var(--muted);line-height:1.9;">
              儲存後，點選下方「下載 content.js」按鈕，<br/>
              將下載的 <code style="background:rgba(200,169,110,.12);padding:.1rem .3rem;border-radius:3px;">content.js</code> 替換至你的 GitHub repo 的 <code style="background:rgba(200,169,110,.12);padding:.1rem .3rem;border-radius:3px;">js/</code> 資料夾，<br/>
              push 後 GitHub Pages 會自動更新網站內容。
            </p>
            <button class="save-btn" id="dl-btn" onclick="downloadContentJS()" style="margin-top:1rem;max-width:220px;">
              ⬇ 下載 content.js
            </button>
          </div>
        </div>
      </div>

    </main>

    <!-- Save Bar -->
    <div class="save-bar">
      <span class="save-bar-info">儲存後記得下載並更新 content.js</span>
      <button class="save-btn" id="save-btn" onclick="saveContent()">💾 儲存變更</button>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/content.js"></script>
  <script>
    // ── AUTH ────────────────────────────────────────────────────
    const DEFAULT_PWD = 'peirong2025';
    const PWD_KEY  = 'pr_admin_pwd';
    const AUTH_KEY = 'pr_admin_auth';

    function getStoredPwd() {
      return localStorage.getItem(PWD_KEY) || DEFAULT_PWD;
    }
    function doLogin() {
      const val = document.getElementById('pwd-input').value;
      if (val === getStoredPwd()) {
        sessionStorage.setItem(AUTH_KEY, '1');
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-app').style.display = 'block';
        loadForm();
      } else {
        document.getElementById('login-err').style.display = 'block';
        document.getElementById('pwd-input').value = '';
        document.getElementById('pwd-input').focus();
      }
    }
    document.getElementById('pwd-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    function doLogout() {
      sessionStorage.removeItem(AUTH_KEY);
      location.reload();
    }
    function changePwd() {
      const np = document.getElementById('new-pwd').value.trim();
      if (!np) { showToast('請輸入新密碼', 'error'); return; }
      if (np.length < 6) { showToast('密碼至少 6 位', 'error'); return; }
      localStorage.setItem(PWD_KEY, np);
      document.getElementById('new-pwd').value = '';
      showToast('密碼已變更', 'success');
    }
    // Auto-restore session
    if (sessionStorage.getItem(AUTH_KEY) === '1') {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-app').style.display = 'block';
    }

    // ── CONTENT ─────────────────────────────────────────────────
    let currentContent = {};

    function loadForm() {
      currentContent = Object.assign({}, window.SITE_CONTENT || {});
      const fields = [
        'site_name','site_tagline','hero_price','hero_desc',
        'hours','hours_note','pricing','pricing_note',
        'booking','booking_note','phone','line_id',
        'contact_title','contact_sub','address','mrt','bus','footer_copy'
      ];
      fields.forEach(key => {
        const el = document.getElementById('f-' + key);
        if (el) el.value = currentContent[key] || '';
      });
    }

    function readForm() {
      const fields = [
        'site_name','site_tagline','hero_price','hero_desc',
        'hours','hours_note','pricing','pricing_note',
        'booking','booking_note','phone','line_id',
        'contact_title','contact_sub','address','mrt','bus','footer_copy'
      ];
      const out = {};
      fields.forEach(key => {
        const el = document.getElementById('f-' + key);
        if (el) out[key] = el.value;
      });
      return out;
    }

    function saveContent() {
      currentContent = readForm();
      localStorage.setItem('pr_site_content', JSON.stringify(currentContent));
      showToast('已儲存！請下載 content.js 並上傳至 GitHub', 'success');
    }

    function generateContentJS(c) {
      return `/**
 * content.js — 沛蓉百元剪髮 網站內容設定
 * 由管理員後台自動生成於 ${new Date().toLocaleString('zh-TW')}
 */
window.SITE_CONTENT = ${JSON.stringify(c, null, 2)};
`;
    }

    function downloadContentJS() {
      const c = readForm();
      const blob = new Blob([generateContentJS(c)], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'content.js';
      a.click();
      URL.revokeObjectURL(url);
      showToast('content.js 已下載，請上傳至 GitHub js/ 資料夾', 'success');
    }

    // ── TOAST ────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + type + ' show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.classList.remove('show'); }, 3200);
    }

    // Restore from localStorage if exists
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('pr_site_content');
      if (saved) {
        try { window.SITE_CONTENT = JSON.parse(saved); } catch(e) {}
      }
      if (sessionStorage.getItem(AUTH_KEY) === '1') loadForm();
    });
  </script>
</body>
</html>
